name: MeetingMind CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv and locked API dependencies
        run: python -m pip install uv==0.12.17 && uv sync --frozen --group dev
      - name: Check Python dependency consistency
        run: uv pip check
      - name: Install FFmpeg for audio boundary tests
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Audit repository candidate files
        run: uv run --frozen python scripts/repository_audit.py
      - name: Audit complete Git history
        run: uv run --frozen python scripts/git_history_audit.py
      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: uv run --frozen python -m pytest -q backend/tests
      - name: Verify committed Gold Standard report inputs
        run: uv run --frozen python evaluation/evaluate.py --output /tmp/meetingmind-evaluation.json --minimum 0.8
      - name: Verify committed Day-7 audio end-to-end evidence
        run: uv run --frozen python evaluation/verify_day7_e2e_report.py
      - name: Upload Day-7 acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: day7-acceptance-evidence
          path: evaluation/reports/day7-e2e-latest.json
          if-no-files-found: error

  frontend-build:
    name: Frontend type-check and build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run frontend unit tests
        run: npm run test
      - name: Type-check and build
        run: npm run build
