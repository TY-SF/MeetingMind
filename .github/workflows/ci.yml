name: MeetingMind CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-api.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-api.txt
      - name: Check Python dependency consistency
        run: python -m pip check
      - name: Audit repository candidate files
        run: python scripts/repository_audit.py
      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m pytest -q backend/tests
      - name: Verify committed Gold Standard report inputs
        run: python evaluation/evaluate.py --output /tmp/meetingmind-evaluation.json --minimum 0.8

  frontend-build:
    name: Frontend type-check and build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run frontend unit tests
        run: npm run test
      - name: Type-check and build
        run: npm run build
