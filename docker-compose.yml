services:
  mysql:
    image: mysql:8.4
    container_name: meetingmind-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meetingmind}
      MYSQL_USER: ${MYSQL_USER:-meetingmind}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.compose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.compose}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - meetingmind_mysql:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: meetingmind-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - meetingmind_redis:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.10.2-alpine
    container_name: meetingmind-caddy
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EDGE_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${EDGE_HTTPS_PORT:-8443}:${EDGE_HTTPS_PORT:-8443}"
    environment:
      EDGE_HTTPS_PORT: ${EDGE_HTTPS_PORT:-8443}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - meetingmind_caddy_data:/data
      - meetingmind_caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  meetingmind_mysql:
  meetingmind_redis:
  meetingmind_caddy_data:
  meetingmind_caddy_config:
