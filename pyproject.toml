[project]
name = "meetingmind"
version = "0.8.0"
description = "Local-first Chinese meeting audio processing and structured analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.19.2",
  "cryptography>=43,<47",
  "fastapi==0.116.1",
  "openai==3.10.0",
  "pymysql==1.1.1",
  "python-multipart==0.0.20",
  "redis==7.2.1",
  "rq==2.6.1",
  "sqlalchemy==2.0.52",
  "tzdata==2026.4",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
whisperx = [
  "whisperx==3.8.6",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]


